[project]
name = "backend"
version = "0.1.0"
description = "Single-assignment grading agent with teacher review"
readme = "README.md"
authors = [
    { name = "ezer", email = "1379242357@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "python-dotenv>=1,<2",
    "tzdata>=2026.5",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
